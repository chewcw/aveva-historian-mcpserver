name: Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.os }}/${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            ext: ''
          - os: windows
            arch: amd64
            ext: '.exe'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # required for git describe to find tags

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache: true

      - name: Compute version
        id: version
        run: |
          VERSION=$(git describe --tags --always --dirty)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '0'
        run: |
          go build \
            -ldflags "-X github.com/chewcw/aveva-historian-mcpserver/internal/cli.version=${{ steps.version.outputs.version }} -s -w" \
            -o bin/aveva-historian-mcpserver${{ matrix.ext }} \
            ./cmd/server

      - name: Verify version flag works
        if: matrix.os == 'linux'  # .exe cannot execute on ubuntu runner
        run: |
          ./bin/aveva-historian-mcpserver version

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: aveva-historian-mcpserver-${{ steps.version.outputs.version }}-${{ matrix.os }}-${{ matrix.arch }}
          path: bin/aveva-historian-mcpserver${{ matrix.ext }}
          retention-days: 7
